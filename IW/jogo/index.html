<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Caça ao Alvo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">

    <section id="tela-inicial" class="card">
      <h1>🎮 Caça ao Alvo</h1>
      <p>Clique no alvo o máximo de vezes possível antes do tempo acabar.</p>
      <button id="btn-iniciar">Iniciar Jogo</button>
    </section>

    <section id="tela-jogo" class="oculto">
      <div class="painel">
        <p>Pontos: <span id="pontos">0</span></p>
        <p>Tempo: <span id="tempo">30</span>s</p>
        <p>Nível: <span id="nivel">1</span></p>
      </div>

      <div id="area-jogo">
        <div id="alvo"></div>
      </div>
    </section>

    <section id="tela-final" class="card oculto">
      <h2>Fim de Jogo!</h2>
      <p>Sua pontuação final foi:</p>
      <h1 id="pontuacao-final">0</h1>
      <button id="btn-reiniciar">Jogar Novamente</button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
