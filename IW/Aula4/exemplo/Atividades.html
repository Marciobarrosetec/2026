<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Cards</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-5">

  <h2 class="mb-4 text-center">Dashboard Cards</h2>

  <!-- RESULTADO -->
  <div class="card result-card p-4 mb-5" id="resultado">
    <h4>Resultado</h4>
    <p>Clique em um botão para ver o resultado aqui...</p>
  </div>

  <!-- CARDS -->
  <div class="row g-4">

    <!-- LOOP MANUAL DOS 15 CARDS -->
    <!-- Cada col ocupa 2.4 → usamos col para distribuir em 5 por linha -->
    
    <!-- CARD 1 -->
    <div class="col-md-2">
      <div class="card card-custom p-3 text-center">
        <h5>Exercício 1</h5>
        <button class="btn btn-primary btn-custom mt-3" onclick="exercicio1()">Selecionar</button>
      </div>
    </div>

    <script>
        for (let i = 2; i <= 15; i++) {
    document.write(`
      <div class="col-md-2">
        <div class="card card-custom p-3 text-center">
          <h5>Exercício ${i}</h5>
          <button class="btn btn-primary btn-custom mt-3" onclick="exercicio${i}()">
            Selecionar
          </button>
        </div>
      </div>
    `);
  }
    </script>
  </div>
</div>

<!-- JS -->
<script src="Atividades.js"></script>
</body>
</html>
